version: "3.9"

services:
  backend:
    build: ./backend
    container_name: supfile-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src:/app/src
      - ./backend/utils:/app/utils
      - C:/supfile_shared_storage:/app/storage
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: supfile-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
